<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zivikart — Coming Soon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    min-height: 100%;
    background: #0f2f2b;
  }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f2f2b 0%, #14524a 55%, #1a7a6b 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 520px; }
  .logo {
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .logo span { color: #7ee8d4; }
  .tag {
    font-size: 1.1rem;
    opacity: 0.85;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  .badge {
    display: inline-block;
    padding: 8px 20px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.9;
  }
  .footer {
    margin-top: 48px;
    font-size: 0.8rem;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Zivi<span>kart</span></div>
    <div class="badge">Coming Soon</div>
    <div class="footer">&copy; 2026 Zivikart</div>
  </div>
</body>
</html>
